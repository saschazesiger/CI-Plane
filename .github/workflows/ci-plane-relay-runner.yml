# CI-Plane relay runner: runs one runner of CI-Plane on a machine of a pool
# (GitHub-hosted, Blacksmith, ...). The repository of a pool calls it from
# its .github/workflows/ci-plane-relay.yml, pinned to a tag; CI-Plane checks
# in the run's OIDC token that this file, at that tag, is what runs, so
# whoever can change the calling file cannot change this.
name: CI-Plane relay runner

on:
  workflow_call:
    inputs:
      runner:
        description: Name of the runner (set by CI-Plane)
        required: true
        type: string
      url:
        description: Address of CI-Plane (set by CI-Plane)
        required: true
        type: string
      machine:
        description: runs-on label of the machine (set by CI-Plane)
        required: true
        type: string

jobs:
  runner:
    runs-on: ${{ inputs.machine }}
    timeout-minutes: 360
    # Only what is needed to prove to CI-Plane that this run is the one it
    # started: the job that runs on the runner gets its own token from GitHub.
    permissions:
      id-token: write
    steps:
      - name: Run the runner of CI-Plane
        env:
          CI_PLANE_URL: ${{ inputs.url }}
          # A runner that gets no job within this time stops by itself, so
          # that it does not use minutes while CI-Plane cannot remove it.
          IDLE_MINUTES: 20
        run: |
          set -euo pipefail
          case "$CI_PLANE_URL" in
            https://*) ;;
            *) echo "::error::The address of CI-Plane must start with https://"; exit 1 ;;
          esac
          answer="$RUNNER_TEMP/ci-plane-answer.json"
          config="$RUNNER_TEMP/ci-plane-config"
          script="$RUNNER_TEMP/ci-plane-start.sh"
          touch "$answer" "$config" "$script"
          chmod 600 "$answer" "$config" "$script"

          # Collect the runner. CI-Plane hands it only to the run it started,
          # which the OIDC token of this run proves. The token names
          # CI-Plane's address as its audience: it is no good anywhere else,
          # nor is a token made for another address any good here.
          code=000
          for try in 1 2 3 4 5 6; do
            oidc=$(curl -fsSL --retry 3 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg u "${CI_PLANE_URL%/}" '$u|@uri')" | jq -r .value) || oidc=""
            if [ -n "$oidc" ] && [ "$oidc" != null ]; then
              echo "::add-mask::$oidc"
              code=$(curl -sS -o "$answer" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $oidc" "${CI_PLANE_URL%/}/webhook/relay") || code=000
            fi
            case "$code" in
              200) break ;;
              000|429|5??) sleep $((try * 5)) ;;
              *) break ;;
            esac
          done
          if [ "$code" != 200 ]; then
            echo "::error::CI-Plane did not hand out the runner (HTTP $code): $(jq -r '.error // empty' "$answer" 2>/dev/null || true)"
            exit 1
          fi
          name=$(jq -r .runner "$answer")
          case "$name" in
            ci-plane-*[!a-z0-9-]*|"") echo "::error::CI-Plane named no runner"; exit 1 ;;
            ci-plane-*) ;;
            *) echo "::error::CI-Plane named no runner"; exit 1 ;;
          esac
          jq -j .jitconfig "$answer" > "$config"
          jq -r .script "$answer" > "$script"
          rm -f "$answer"
          echo "::add-mask::$(cat "$config")"

          # Start the runner the way a worker of CI-Plane does: in the same
          # two containers (its own Docker daemon and the runner image), so
          # the job finds the same environment as on a worker. The script
          # comes from CI-Plane and reads the configuration from its input;
          # neither the job nor the script sees the variables of this
          # workflow.
          { cat "$config"; echo; } | env -i HOME="$HOME" PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin sh "$script"
          rm -f "$config" "$script"

          # The runner exits after its one job. Until it takes one, there is
          # no job log (_diag/Worker_*.log) in it.
          deadline=$(( $(date +%s) + IDLE_MINUTES * 60 ))
          while [ "$(docker inspect -f '{{.State.Running}}' "$name-runner" 2>/dev/null)" = true ]; do
            if docker exec "$name-runner" sh -c 'ls /home/runner/_diag/Worker_*.log >/dev/null 2>&1'; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "No job came within $IDLE_MINUTES minutes; stopping the runner."
              docker stop -t 20 "$name-runner" >/dev/null || true
              exit 0
            fi
            sleep 10
          done
          code=$(docker wait "$name-runner")
          if [ "$code" != 0 ]; then
            echo "::error::The runner ended with code $code"
            docker logs --tail 40 "$name-runner" 2>&1 || true
          fi
          exit "$code"
