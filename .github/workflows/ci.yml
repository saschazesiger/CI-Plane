name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Z-Dash comes with the Z-Dash server module (go.mod); its copy carries the tools.
      - name: The module's copy of Z-Dash
        run: |
          go mod download github.com/saschazesiger/Z-Dash/server
          ZD="$(go list -m -f '{{.Dir}}' github.com/saschazesiger/Z-Dash/server)/zdash/dist"
          rm -rf web/.z-dash && cp -R "$ZD" web/.z-dash && chmod -R u+w web/.z-dash
          sh web/.z-dash/tools/verify.sh web/.z-dash
      - name: Interface follows the Z-Dash project rules
        run: node web/.z-dash/tools/check-project.mjs --config web/ds-check.json
      - name: Theme keeps its contrast, light and dark
        run: node web/.z-dash/tools/check-theme.mjs web/theme.css --with web/.z-dash/themes/dark.css
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build image
        run: docker build -t ci-plane:ci .
