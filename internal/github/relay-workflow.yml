# CI-Plane relay: runs one runner of CI-Plane on a GitHub-hosted machine
# when none of your own workers has room for a job of this repository.
# CI-Plane starts this workflow by itself, one run per runner, and only if
# the failover is switched on for this repository; runs started by hand get
# nothing. Each run uses the GitHub Actions minutes of the repository's owner.
name: CI-Plane relay
run-name: ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Name of the runner (set by CI-Plane)
        required: true
        type: string
      url:
        description: Address of CI-Plane (set by CI-Plane)
        required: true
        type: string

permissions:
  id-token: write

jobs:
  runner:
    uses: saschazesiger/CI-Plane/.github/workflows/ci-plane-relay-runner.yml@relay-v1
    with:
      runner: ${{ inputs.runner }}
      url: ${{ inputs.url }}
